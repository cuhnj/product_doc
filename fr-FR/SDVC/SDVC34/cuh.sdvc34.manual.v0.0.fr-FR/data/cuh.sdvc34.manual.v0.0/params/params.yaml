      n'a ni sortie ni son
    Suggestions de dépannage: ◆ Assurez-vous que le câble de puissance de sortie est
      solidement raccordé.<br>◆ Assurez-vous que la tension de sortie n'est pas trop
      basse.<br>◆ Assurez-vous que le contrôleur n'a pas été arrêté par le bouton
      ON/OFF alors que le voyant d'arrêt est allumé.<br>◆ Assurez-vous que le contrôleur
      n'a pas été arrêté par le réglage des paramètres Γ2 ou Γ7 alors que le voyant
      d'arrêt est allumé.<br>◆ Réinitialisez le contrôleur.
