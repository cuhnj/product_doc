- name: L'écran LED affiche normalement mais l'alimentateur vibrant n'a aucune sortie
    ni son
  symbol: null
  range: null
  default: null
  unit: null
  note: null
  extra:
    Phénomène de défaut: L'écran LED affiche normalement mais l'alimentateur vibrant
      n'a aucune sortie ni son
    Suggestions de dépannage: ● Assurez-vous que le câble d'alimentation de sortie
      est correctement connecté.<br>● Assurez-vous que la tension de sortie n'est
      pas trop faible.<br>● Assurez-vous que le contrôleur n'est pas arrêté par le
      bouton ON/OFF lorsque l'indicateur d'arrêt est allumé.<br>● Assurez-vous que
      le contrôleur n'est pas arrêté par le signal de commande marche/arrêt lorsque
      l'indicateur d'arrêt est allumé.<br>● Assurez-vous que le contrôleur n'est pas
      arrêté par le réglage des paramètres Γ2 ou Γ7 lorsque l'indicateur d'arrêt est
      allumé.<br>● Réinitialisez le contrôleur.
  source_ref:
    kind: publish_md_section_table
    section_index: 55
    heading_path: *id029
    heading_title: 'Annexe D : Suggestions de dépannage et explications des erreurs'
    table_role: generic
