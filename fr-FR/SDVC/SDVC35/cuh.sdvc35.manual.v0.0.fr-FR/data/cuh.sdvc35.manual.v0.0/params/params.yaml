    Suggestions de dépannage: • Assurez-vous que la tension de sortie n'est pas trop
      faible<br>• Assurez-vous que l'état de fonctionnement du contrôleur n'est pas
      « Man », commandé par l'appui sur le bouton « ON/OFF » du panneau<br>• Assurez-vous
      que l'état de fonctionnement du contrôleur n'est pas « STP », commandé par les
      ports C/E<br>• Assurez-vous que l'état de fonctionnement du contrôleur n'est
      pas « STP », commandé par le paramètre de sens logique des ports C/E<br>• Réinitialisez
