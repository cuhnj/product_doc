    Vorschläge zur Fehlerbehebung: ● Stellen Sie sicher, dass das Ausgangsleistungskabel
      zuverlässig angeschlossen ist.<br>● Stellen Sie sicher, dass die Ausgangsspannung
      nicht zu niedrig ist.<br>● Stellen Sie sicher, dass der Controller nicht durch
      die EIN/AUS-Taste gestoppt wurde, wenn die Stopp-Anzeige leuchtet.<br>● Stellen
      Sie sicher, dass der Controller nicht durch das EIN/AUS-Steuersignal gestoppt
      wurde, wenn die Stopp-Anzeige leuchtet.<br>● Stellen Sie sicher, dass der Controller
      nicht durch die Einstellung von Parameter Γ2 oder Γ7 gestoppt wurde, wenn die
      Stopp-Anzeige leuchtet.<br>● Setzen Sie den Controller zurück.
