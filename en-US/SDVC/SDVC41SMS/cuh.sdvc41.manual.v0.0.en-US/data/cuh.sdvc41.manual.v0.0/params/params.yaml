  symbol: null
  range: null
  default: null
  unit: null
  note: null
  extra:
    Fault Phenomenon: No display on LED screen after power on startup
    Troubleshooting Suggestions: ● Make sure the mains jack is live.<br>● Make sure
      the Input Power Cable is reliably connected.
  source_ref:
