- name: LED screen displays normally but vibratory feeder has no output or sound
  symbol: null
  range: null
  default: null
  unit: null
  note: null
  extra:
    Fault Phenomenon: LED screen displays normally but vibratory feeder has no output
      or sound
    Troubleshooting Suggestions: ● Make sure the Output Power Cable is reliably connected.<br>●
      Make sure Output Voltage is not too low.<br>● Make sure the controller is not
      stopped by the ON/OFF button when the Stop Indicator is on.<br>● Make sure the
      controller is not stopped by the ON/OFF control signal when the Stop Indicator
      is on.<br>● Make sure the controller is not stopped by parameters Γ2 or Γ7 setting
      when the Stop Indicator is on.<br>● Reset the controller.
  source_ref:
    kind: publish_md_section_table
    section_index: 55
    heading_path: *id029
    heading_title: 'Appendix D: Troubleshooting Suggestions and Error Explanations'
    table_role: generic
    table_md_path: tables/0055-chapter-ⅵ-signal-control-table-01.md
- name: ON/OFF Control does not work
  symbol: null
  range: null
  default: null
  unit: null
  note: null
  extra:
    Fault Phenomenon: ON/OFF Control does not work
    Troubleshooting Suggestions: ● Make sure ON/OFF Control Signal is correctly connected
      to the controller.<br>● Make sure parameters Γ2, Γ7 and Π are set correctly
      as you control expectation.<br>● Reset the controller.
  source_ref:
    kind: publish_md_section_table
    section_index: 55
    heading_path: *id029
