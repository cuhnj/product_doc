  default: null
  unit: null
  note: null
  extra:
    Fault Phenomenon: LED screen displays Err01
    Troubleshooting Suggestions: '**Short-Circuit Protection**<br>● Make sure the
      Output Power Cable and the vibrator electromagnet are not short circuited.<br>●
      Disconnect the Output Power Cable from the controller and turn on the power
      switch again.<br>If Err01 is still displayed on the LED screen, contact us for
      repair.'
