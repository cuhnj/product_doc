  note: null
  extra:
    Error Code: Er02H
    Meaning: Motor electronics overheating
    Occurrence Conditions: Motor exceeds electrical power overheating threshold
    Controller Response: Stop and automatic restart or run at decrease power rating
      according to Power Derating Factor setting.
    Troubleshooting Methods: ◆ Appropriately reduce the motor operating frequency
      setting.
  source_ref:
