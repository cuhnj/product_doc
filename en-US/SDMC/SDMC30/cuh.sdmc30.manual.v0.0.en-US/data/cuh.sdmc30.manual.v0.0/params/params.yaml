    Meaning: Main output short circuit
    Occurrence Conditions: Short circuit output phase-to-phase or phase-to-PE
    Controller Response: Stop the main output, short press ON/OFF button to clear.
    Troubleshooting Methods: ◆ Short-circuit the output switch or switch off the output
      switch twice, then power on again.
