- name: La pantalla LED se visualiza con normalidad, pero el alimentador vibratorio
    no tiene salida ni sonido
  symbol: null
  range: null
  default: null
  unit: null
  note: null
  extra:
    Fenómeno de fallo: La pantalla LED se visualiza con normalidad, pero el alimentador
      vibratorio no tiene salida ni sonido
    Sugerencias de solución de problemas: ● Asegúrese de que el cable de salida esté
      conectado de forma fiable.<br>● Asegúrese de que la tensión de salida no sea
      demasiado baja.<br>● Asegúrese de que el controlador no esté detenido por el
      botón ON/OFF cuando el indicador de parada esté encendido.<br>● Asegúrese de
      que el controlador no esté detenido por la señal de control ON/OFF cuando el
      indicador de parada esté encendido.<br>● Asegúrese de que el controlador no
      esté detenido por el ajuste de los parámetros Γ2 o Γ7 cuando el indicador de
      parada esté encendido.<br>● Restablezca el controlador.
